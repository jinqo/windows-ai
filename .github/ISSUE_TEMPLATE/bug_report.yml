name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Windows AI version
      description: Settings → Startup → About
      placeholder: "0.1.2"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI provider
      options: [Claude (Claude Code), Free / local (OpenAI-compatible), Anthropic API key, FreeLLMAPI fallback, Not relevant]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help a lot. Please don't paste API keys or private text.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or Activity log entry
      render: text
