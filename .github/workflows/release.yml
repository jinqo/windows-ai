name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      HAS_CERT: ${{ secrets.MSIX_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        shell: bash
        run: |
          npm run build:shell
          npm run typecheck
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build installer
        run: npx tauri build

      # Signed sparse MSIX for the Windows 11 top-level context menu.
      # Runs only when a trusted signing certificate is configured as repo
      # secrets (never committed): MSIX_PFX_BASE64 + MSIX_PFX_PASSWORD, and
      # signing.json profile "release" holds the certificate's exact Subject.
      - name: Build signed MSIX
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        env:
          WINDOWS_AI_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.MSIX_PFX_BASE64 }}"))
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version + ".0"
          $setup = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          ./shell-ext/package/package.ps1 -Profile release -PfxPath $pfx -Version $v -AlsoSign $setup
          Remove-Item $pfx -Force

      - name: Package VS Code extension
        working-directory: extensions/vscode
        run: npx --yes @vscode/vsce@3 package --no-dependencies --allow-missing-repository --skip-license

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # No spaces: GitHub renames them in asset names, which would break SHA256SUMS lookups.
          $src = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $setupName = "WindowsAI_${v}_x64-setup.exe"
          Copy-Item $src.FullName "out/$setupName"
          # Updater signature over the final bytes (re-signed after optional Authenticode signing).
          npx tauri signer sign "out/$setupName"
          if ($LASTEXITCODE) { throw "updater signing failed" }
          $sig = (Get-Content "out/$setupName.sig" -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/$setupName"
          $platform = @{ signature = $sig; url = $url }
          @{ version = $v; notes = "See https://github.com/${{ github.repository }}/releases/tag/v$v"; pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); platforms = @{ "windows-x86_64" = $platform; "windows-x86_64-nsis" = $platform } } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM out/latest.json
          Copy-Item extensions/vscode/*.vsix out/
          if (Test-Path shell-ext/package/out/WindowsAI.msix) { Copy-Item shell-ext/package/out/WindowsAI.msix out/ }
          Compress-Archive -Path extensions/browser/* -DestinationPath out/windows-ai-browser-extension.zip
          Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Set-Content out/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
